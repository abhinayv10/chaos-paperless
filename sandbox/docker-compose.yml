# Paperless-ngx chaos sandbox.
#
# Derived from the upstream docker/compose/docker-compose.postgres.yml
# (paperless-ngx v3.2.1, GPL-3.0) with these sandbox changes:
#   - fixed compose project name so the chaos controller can scope every
#     operation to this project only
#   - pinned application image, healthchecks on every service
#   - webserver bound to 127.0.0.1 only (not reachable from the LAN)
#   - db / broker publish no ports at all
#   - every container carries the label chaos.sandbox=true; the controller
#     refuses to touch any container without it
#   - admin user + secret come from sandbox/.env (generated by `python -m chaos up`)
name: paperless-chaos

x-sandbox: &sandbox
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  labels:
    chaos.sandbox: "true"

services:
  broker:
    <<: *sandbox
    image: docker.io/valkey/valkey:9-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    <<: *sandbox
    image: docker.io/library/postgres:18
    volumes:
      - pgdata:/var/lib/postgresql
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${PAPERLESS_DB_PASSWORD:?run python -m chaos up to generate sandbox/.env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperless -d paperless"]
      interval: 5s
      timeout: 3s
      retries: 10

  webserver:
    <<: *sandbox
    # Official Docker Hub copy of ghcr.io/paperless-ngx/paperless-ngx:3.2.1
    # (identical manifest digest); pinned by digest for reproducibility.
    image: docker.io/paperlessngx/paperless-ngx:3.2.1@sha256:5fa76604a81df6945086e0837b14b56543d137e8ce4f311cc5d9ebe907e74e79
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - data:/usr/src/paperless/data
      - media:/usr/src/paperless/media
      - ./export:/usr/src/paperless/export
      - ./consume:/usr/src/paperless/consume
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBPASS: ${PAPERLESS_DB_PASSWORD}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:?run python -m chaos up}
      PAPERLESS_ADMIN_USER: ${PAPERLESS_ADMIN_USER:-chaosadmin}
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD:?run python -m chaos up}
      PAPERLESS_URL: http://localhost:8000
      PAPERLESS_TIME_ZONE: UTC
      PAPERLESS_OCR_LANGUAGE: eng
      PAPERLESS_TASK_WORKERS: 1
      PAPERLESS_THREADS_PER_WORKER: 1
      PAPERLESS_WEBSERVER_WORKERS: 2
    healthcheck:
      test: ["CMD", "curl", "-fs", "-S", "-L", "--max-time", "2", "http://localhost:8000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

volumes:
  data:
  media:
  pgdata:
  redisdata:
